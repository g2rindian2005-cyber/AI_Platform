name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            # ==============================
            # PROJECT DIRECTORY
            # ==============================
            APP_DIR=/home/ec2-user/AI_Platform

            echo "== Checking project directory =="
            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: Project directory does not exist: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            echo "== Current directory =="
            pwd

            echo "== Pulling latest code =="
            git pull origin main

            # ==============================
            # BACKEND ENVIRONMENT
            # ==============================
            echo "== Writing backend/.env =="

            cat > "$APP_DIR/backend/.env" <<'EOF'
            ${{ secrets.BACKEND_ENV }}
            EOF

            chmod 600 "$APP_DIR/backend/.env"

            # ==============================
            # FRONTEND ENVIRONMENT
            # ==============================
            echo "== Writing frontend/.env =="

            cat > "$APP_DIR/frontend/.env" <<'EOF'
            ${{ secrets.FRONTEND_ENV }}
            EOF

            # ==============================
            # BACKEND
            # ==============================
            echo "== Backend: install dependencies =="

            cd "$APP_DIR/backend"

            npm install --production

            echo "== Restarting backend =="

            pm2 restart devopsai-backend --update-env || \
              pm2 start server.js --name devopsai-backend

            pm2 save

            # ==============================
            # FRONTEND
            # ==============================
            echo "== Frontend: install dependencies =="

            cd "$APP_DIR/frontend"

            npm install

            echo "== Frontend: build =="

            npm run build

            # ==============================
            # NGINX
            # ==============================
            echo "== Publishing frontend to Nginx =="

            sudo mkdir -p /var/www/devopsai

            sudo rm -rf /var/www/devopsai/*

            sudo cp -r dist/* /var/www/devopsai/

            # ==============================
            # HEALTH CHECK
            # ==============================
            echo "== Backend health check =="

            sleep 2

            curl -f http://localhost:5000/api/health

            echo "================================="
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "================================="
