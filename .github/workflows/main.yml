name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            # ==============================
            # PROJECT SETTINGS
            # ==============================

            APP_DIR="$HOME/AI_Platform"
            REPO_URL="https://github.com/g2rindian2005-cyber/AI_Platform.git"

            echo "Repository: $REPO_URL"
            echo "Project directory: $APP_DIR"

            # ==============================
            # CLONE OR UPDATE REPOSITORY
            # ==============================

            if [ ! -d "$APP_DIR/.git" ]; then

              echo "== Repository not found =="
              echo "== Cloning repository =="

              rm -rf "$APP_DIR"

              git clone "$REPO_URL" "$APP_DIR"

            else

              echo "== Repository already exists =="
              echo "== Pulling latest code =="

              cd "$APP_DIR"

              git fetch origin
              git reset --hard origin/main

            fi

            cd "$APP_DIR"

            echo "== Current project =="
            pwd

            # ==============================
            # BACKEND ENV
            # ==============================

            echo "== Writing backend/.env =="

            cat > "$APP_DIR/backend/.env" <<'EOF'
            ${{ secrets.BACKEND_ENV }}
            EOF

            chmod 600 "$APP_DIR/backend/.env"

            # ==============================
            # FRONTEND ENV
            # ==============================

            echo "== Writing frontend/.env =="

            cat > "$APP_DIR/frontend/.env" <<'EOF'
            ${{ secrets.FRONTEND_ENV }}
            EOF

            # ==============================
            # BACKEND
            # ==============================

            echo "== Installing backend =="

            cd "$APP_DIR/backend"

            npm install --production

            echo "== Restarting backend =="

            pm2 restart devopsai-backend --update-env || \
              pm2 start server.js --name devopsai-backend

            pm2 save

            # ==============================
            # FRONTEND
            # ==============================

            echo "== Installing frontend =="

            cd "$APP_DIR/frontend"

            npm install

            echo "== Building frontend =="

            npm run build

            # ==============================
            # NGINX
            # ==============================

            echo "== Publishing frontend =="

            sudo mkdir -p /var/www/devopsai

            sudo rm -rf /var/www/devopsai/*

            sudo cp -r dist/* /var/www/devopsai/

            # ==============================
            # HEALTH CHECK
            # ==============================

            echo "== Health check =="

            sleep 2

            curl -f http://localhost:5000/api/health

            echo "================================"
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "================================"
