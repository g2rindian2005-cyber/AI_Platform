name: Deploy AI Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m

          script: |
            set -e

            APP_DIR="$HOME/AI_Platform"

            echo "==> Installing required packages"

            # Git
            command -v git >/dev/null 2>&1 || sudo dnf install -y git

            # Node.js 20
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
              sudo dnf install -y nodejs
            fi

            # PM2
            command -v pm2 >/dev/null 2>&1 || sudo npm install -g pm2

            # Nginx
            command -v nginx >/dev/null 2>&1 || sudo dnf install -y nginx

            echo "Node: $(node -v)"
            echo "NPM: $(npm -v)"
            echo "Git: $(git --version)"
            echo "PM2: $(pm2 -v)"

            # Clone / update project
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/g2rindian2005-cyber/AI_Platform.git "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            # Backend environment
            printf '%s\n' '${{ secrets.BACKEND_ENV }}' > "$APP_DIR/backend/.env"
            chmod 600 "$APP_DIR/backend/.env"

            # Frontend environment
            printf '%s\n' '${{ secrets.FRONTEND_ENV }}' > "$APP_DIR/frontend/.env"

            # Backend
            cd "$APP_DIR/backend"
            npm install --omit=dev

            pm2 delete devopsai-backend 2>/dev/null || true
            pm2 start server.js --name devopsai-backend --update-env
            pm2 save

            # Wait for backend
            sleep 5
            curl -f http://127.0.0.1:5000/api/health

            # Frontend
            cd "$APP_DIR/frontend"
            npm install
            npm run build

            # Nginx
            sudo mkdir -p /var/www/devopsai
            sudo rm -rf /var/www/devopsai/*
            sudo cp -r dist/. /var/www/devopsai/
            sudo chmod -R 755 /var/www/devopsai

            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            echo "================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "================================"
